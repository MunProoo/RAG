services:
  # 1. Open WebUI 메인 컨테이너
  open-webui:
    image: ghcr.io/open-webui/open-webui:latest
    ports:
      - "8080:8080"
    environment:
      # 데이터베이스 설정
      - DB_DRIVER=postgres
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=open-webui
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_SSL_MODE=disable
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/open-webui
      # 캐시 설정
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      # Ollama API 설정 (compose GPU ollama 서비스)
      - OLLAMA_URL=http://ollama:11434
      - OLLAMA_API_URL=http://ollama:11434
      # Open WebUI Pipelines (RAG 파이프라인) 연동
      # Open WebUI는 OpenAI-compatible endpoint로 Pipelines를 호출합니다.
      - OPENAI_API_BASE_URL=http://pipelines:9099
      - OPENAI_API_KEY=0p3n-w3bu!
      # 후속 질문(답변 아래 칩) 자동 생성 — 이미 DB에 설정이 박혀 있으면 env만으로는 안 바뀔 수 있음(아래 UI 권장)
      - ENABLE_FOLLOW_UP_GENERATION=false
    restart: unless-stopped
    volumes:
      # Open WebUI의 로컬 데이터 영속화
      - openwebui_data:/app/backend/data
    depends_on:
      - postgres
      - redis
      - pipelines
      - ollama
    networks:
      - webui

  # 2. PostgreSQL 데이터베이스
  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=open-webui
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - webui

  # 3. Redis 캐시
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    restart: unless-stopped
    networks:
      - webui

  # 4. Ollama (GPU). 호스트 Ollama CUDA 미탐지 시에도 Docker GPU로 추론합니다.
  # 호스트에서 동일 포트(11434)를 쓰는 Ollama가 있으면 중지한 뒤 기동하세요.
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      # 호스트에 이미 pull된 모델 재사용(Windows: %USERPROFILE%\.ollama)
      - type: bind
        source: ${USERPROFILE}/.ollama
        target: /root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=30m
      - OLLAMA_FLASH_ATTENTION=1
      - OLLAMA_NO_CLOUD=true
      # 동시 요청 슬롯(VRAM 여유 내에서 직렬화 완화)
      - OLLAMA_NUM_PARALLEL=2
    gpus: all
    restart: unless-stopped
    networks:
      - webui

  # 5. Open WebUI Pipelines 서버 (RAG 파이프라인 로더)
  pipelines:
    image: ghcr.io/open-webui/pipelines:main
    ports:
      - "9099:9099"
    volumes:
      - ./rag/pipelines:/app/pipelines
      - ./rag/data/chroma_db:/app/chroma_db
      - ./rag/requirements.txt:/app/requirements.txt:ro
    environment:
      - PIPELINES_DIR=/app/pipelines
      # pipelines 컨테이너 내부에 requirements 설치 (chromadb/임베딩 등 버전 정합성)
      - PIPELINES_REQUIREMENTS_PATH=/app/requirements.txt
      # compose GPU ollama 서비스
      - OLLAMA_BASE_URL=http://ollama:11434
      # ChromaDB 경로 (컨테이너 내부)
      - CHROMA_PATH=/app/chroma_db
      - CHROMA_COLLECTION=rag_documents
      # 한국어 임베딩 모델
      - EMBEDDING_MODEL=BAAI/bge-m3
      - BM25_INDEX_PATH=/app/chroma_db/bm25_index.json
      - TOP_K=4
      - MAX_CHUNKS_PER_SOURCE=2
      # 지연 최적화: 문서 컨텍스트 축소. NUM_PREDICT는 length 조기절단 방지 여유 유지
      - MAX_CONTEXT_CHARS=2800
      - OLLAMA_NUM_CTX=4096
      - OLLAMA_NUM_PREDICT=768
      - OLLAMA_READ_TIMEOUT=600
      - OLLAMA_KEEP_ALIVE=30m
      - REWRITE_MODEL=qwen3.5:4b
      - ANSWER_MODEL=qwen3.5:4b
      - VECTOR_CANDIDATES=12
      - BM25_CANDIDATES=12
      # 리랭크는 유지하되 크로스인코더는 끄고 근거 점수만 사용(검색 ≤625ms)
      - RERANK_ENABLED=true
      - RERANK_MODEL=BAAI/bge-reranker-v2-m3
      - RERANK_CANDIDATES=8
      - RERANK_NEURAL=false
      # false로 두면 LLM 질문 재작성을 생략해 응답 지연이 줄어듭니다.
      - USE_QUERY_REWRITE=false
      # 후속 질문("그거 자세히")을 이전 대화 기반 독립형 질문으로 바꿔 검색
      - CONTEXTUALIZE_FOLLOW_UP=true
    restart: unless-stopped
    depends_on:
      - ollama
    networks:
      - webui

  # 6. 정적 이미지 서버 (Open WebUI/Pipelines에서 URL로 참조)
  # - 호스트: http://localhost:8090/<파일명>
  # - 컨테이너 간: http://imageserver/<파일명>
  imageserver:
    image: nginx:alpine
    ports:
      - "8090:80"
    volumes:
      - ./rag/data/assets:/usr/share/nginx/html:ro
    restart: unless-stopped
    networks:
      - webui

  # 7. 문서 인덱싱 전용 컨테이너 (ChromaDB 생성/갱신)
  # 사용 예:
  #   docker compose run --rm indexer
  #   docker compose run --rm indexer python /app/scripts/index_documents.py /app/docs --reset
  #   docker compose run --rm indexer python /app/scripts/index_documents.py /app/docs --status
  indexer:
    build:
      context: ./rag
      dockerfile: Dockerfile.indexer
    volumes:
      - ./rag/scripts:/app/scripts
      # Regression tests import the same retrieval code used by the pipeline.
      - ./rag/pipelines:/app/pipelines:ro
      - ./rag/data/docs:/app/docs
      - ./rag/data/chroma_db:/app/chroma_db
      # Golden-set retrieval evaluation (scripts/eval_retrieval.py)
      - ./rag/data/eval:/app/data/eval
    environment:
      - CHROMA_PATH=/app/chroma_db
      - CHROMA_COLLECTION=rag_documents
      - EMBEDDING_MODEL=BAAI/bge-m3
      - BM25_INDEX_PATH=/app/chroma_db/bm25_index.json
      - CHUNK_SIZE=480
      - CHUNK_OVERLAP=80
      - VECTOR_CANDIDATES=20
      - BM25_CANDIDATES=20
    restart: "no"

networks:
  webui:
    driver: bridge

volumes:
  pgdata:
  redisdata:
  openwebui_data:
